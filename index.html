<style>.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;background:#dfeaf8;touch-action:none;-webkit-tap-highlight-color:transparent}
.leaflet-tile{visibility:hidden;user-select:none}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container .leaflet-overlay-pane svg,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}

function hav(a,b){const r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
function bez(a,c,b){const p=[];for(let t=0;t<=1.001;t+=.05)p.push([(1-t)*(1-t)*a[0]+2*t*(1-t)*c[0]+t*t*b[0],(1-t)*(1-t)*a[1]+2*t*(1-t)*c[1]+t*t*b[1]]);return p}

async function geo(t,f){const pk=f&&S.pk[f];if(pk&&pk.n==t)return pk;const k=Object.keys(P).find(n=>n.toLowerCase()==t.toLowerCase());if(k)return{n:k,c:P[k],q:P[k][0]+','+P[k][1]};
const m=t.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/);if(m)return{n:'Mi ubicación',c:[+m[1],+m[3]],q:m[1]+','+m[3]};

let c=null;for(const q of [...new Set([addrQ(clean),addrQ(street)])]){c=await nom(q);if(c)break;await new Promise(r=>setTimeout(r,400))}
return{n:t,c,q:addrQ(t)}}

A.sos=()=>modal('¿A quién necesitas llamar?','',[['123 – Policía Nacional','conf','red','123|Policía Nacional'],['119 – Bomberos','conf','red','119|Bomberos'],['Cancelar','close']]);
A.conf=el=>{const[n,t]=el.dataset.v.split('|');modal(`¿Llamar al ${n}?`,`<p><b>${t}</b>. Se abrirá el marcador de tu dispositivo para que confirmes la llamada. Esta demo no realiza llamadas por sí sola.</p>`,[[`Sí, abrir marcador del ${n}`,'dial','red',n],['Cancelar','close']])};
A.dial=el=>{S.modal=null;render(1);try{location.href='tel:'+el.dataset.v}catch(x){}toast('Si tu dispositivo no puede hacer llamadas, marca '+el.dataset.v+' manualmente desde un teléfono.')};
A.tg=el=>{const k=el.dataset.v;S[k]=!S[k];if(k=='dark')document.documentElement.dataset.theme=S.dark?'dark':'light';render(1)};
A.about=()=>modal('Acerca de AlumbrAPP','<p><b>Tu camino, mejor iluminado.</b> Propuesta tecnológica para Floridablanca, Santander: rutas con más información de iluminación, reportes ciudadanos de luminarias y acceso rápido a líneas de emergencia.</p><p>Esta es una demo conceptual con datos ficticios. No está conectada con la Alcaldía ni con autoridades, y ninguna ruta garantiza protección.</p>',[['Entendido','close','pri']]);
A.share=()=>{S.acomp={c:$('#ct').value.trim()||'Contacto',t0:Date.now()};render(1);clearInterval(A.iv);A.iv=setInterval(()=>{const x=$('#el');if(!x||!S.acomp||S.acomp.done)return clearInterval(A.iv);const s=Math.floor((Date.now()-S.acomp.t0)/1000);x.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000)};
A.arr=()=>{S.acomp.done=1;render(1)};A.end=()=>{S.acomp=null;render(1);toast('Acompañamiento finalizado')};
A.runai=el=>{const k=el.dataset.v;S.ai[k]='run';render(1);setTimeout(()=>{S.ai[k]='done';if(S.v=='ai')render(1)},1100)};
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&(ev.target.id=='o'||ev.target.id=='d'))A.find()});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('input',ev=>{if(ev.target.id=='loc')S.draft.loc=ev.target.value;if(ev.target.id=='desc')S.draft.desc=ev.target.value});
document.addEventListener('change',ev=>{if(ev.target.id!='f'||!ev.target.files[0])return;const fl=ev.target.files[0],r=new FileReader();
r.onload=()=>{S.draft.img=r.result;S.draft.ai='run';render(1);setTimeout(()=>{S.draft.ai=78+(fl.name.length*7)%20;if(S.v=='report')render(1)},1200)};r.readAsDataURL(fl)});
render();
</script></body></html>
